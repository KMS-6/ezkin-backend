[project]
name = "aac-backend"
version = "0.1.0"
description = "AAC 비의료적 피부 관리 백엔드"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "anthropic>=0.69,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "email-validator>=2.2,<3",
    "openai>=3,<4",
    "pillow>=11,<12",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
