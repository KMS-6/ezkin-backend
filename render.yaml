services:
  - type: web
    name: ezkin-api
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: AAC_ENVIRONMENT
        value: production
      - key: AAC_DATABASE_URL
        fromDatabase:
          name: ezkin-db
          property: connectionString
      - key: AAC_API_PREFIX
        value: /api/v1
      - key: AAC_DEBUG
        value: "false"
      - key: AAC_CORS_ORIGINS
        sync: false
      - key: AAC_AUTH_SECRET
        sync: false
      - key: AAC_ACCESS_TOKEN_TTL_SECONDS
        value: "86400"

databases:
  - name: ezkin-db
    plan: free
    region: singapore
    databaseName: ezkin
    user: ezkin
    postgresMajorVersion: "17"
