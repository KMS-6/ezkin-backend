name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ezkin_test
          POSTGRES_USER: ezkin
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezkin -d ezkin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AAC_DATABASE_URL: postgresql+asyncpg://ezkin:ci-only-password@localhost:5432/ezkin_test
      AAC_AUTH_SECRET: test-only-auth-secret
      AAC_ADMIN_API_KEY: test-only-admin-key
      AAC_PARTNER_API_KEY: test-only-partner-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic current --check-heads
      - run: uv run pytest

  deployment-config:
    name: Deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby -e 'require "yaml"; YAML.load_file("render.yaml")'
      - run: docker compose config --quiet
      - run: docker build -t ezkin-api:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, deployment-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render responded: $response"
          [ "$response" = "200" ] || [ "$response" = "201" ]
