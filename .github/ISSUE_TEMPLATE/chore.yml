name: Docs or configuration
description: 문서, 설정, 의존성 및 협업 환경 작업을 제안합니다.
title: "[Chore] "
labels: [chore]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
  - type: textarea
    id: notes
    attributes:
      label: 추가 메모
