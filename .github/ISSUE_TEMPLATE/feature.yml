name: Feature request
description: 새로운 기능을 제안하고 구현합니다.
title: "[Feature] "
labels: [feature]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 이 기능이 해결하려는 문제를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
  - type: textarea
    id: notes
    attributes:
      label: 추가 메모
